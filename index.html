<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula Video</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden m-0 p-0 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const NebulaIcon = ({ className = "w-8 h-8" }) => (
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
        <defs>
          <linearGradient id="nebulaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#c084fc" />
            <stop offset="100%" stopColor="#2563eb" />
          </linearGradient>
          <linearGradient id="nebulaGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#f472b6" />
            <stop offset="100%" stopColor="#7c3aed" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="coloredBlur" />
            <feMerge>
              <feMergeNode in="coloredBlur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <ellipse cx="50" cy="50" rx="38" ry="12" transform="rotate(-30 50 50)" stroke="url(#nebulaGrad1)" strokeWidth="4" strokeLinecap="round" filter="url(#glow)" />
        <ellipse cx="50" cy="50" rx="38" ry="12" transform="rotate(30 50 50)" stroke="url(#nebulaGrad2)" strokeWidth="4" strokeLinecap="round" filter="url(#glow)" />
        <path d="M50 25 L53 45 L75 50 L53 55 L50 75 L47 55 L25 50 L47 45 Z" fill="white" filter="url(#glow)" />
        <circle cx="50" cy="50" r="4" fill="#ffffff" />
      </svg>
    );

    class AudioSynth {
      constructor() {
        this.ctx = null;
        this.oscillators = [];
        this.gainNode = null;
        this.isMuted = false;
        this.streamDestination = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.gainNode = this.ctx.createGain();
          this.streamDestination = this.ctx.createMediaStreamDestination();
          this.gainNode.connect(this.ctx.destination);
          this.gainNode.connect(this.streamDestination);
        }
      }

      async resume() {
        if (this.ctx && this.ctx.state === "suspended") {
          await this.ctx.resume();
        }
      }

      playAtmosphere(type) {
        this.init();
        this.stop();
        if (this.isMuted) return;
        this.resume();

        const t = this.ctx.currentTime;
        this.gainNode.gain.cancelScheduledValues(t);
        this.gainNode.gain.setValueAtTime(0.1, t);

        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();

        if (type === "rain") {
          filter.type = "lowpass";
          filter.frequency.value = 600;
          this.gainNode.gain.value = 0.2;
        } else {
          filter.type = "lowpass";
          filter.frequency.value = 100;
          const osc = this.ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.value = 50;
          const oscGain = this.ctx.createGain();
          oscGain.gain.value = 0.15;
          osc.connect(oscGain).connect(this.ctx.destination);
          oscGain.connect(this.streamDestination);
          this.oscillators.push(osc);
          osc.start();
        }

        noise.connect(filter).connect(this.gainNode);
        noise.start();
        this.oscillators.push(noise);
      }

      stop() {
        this.oscillators.forEach(osc => {
          try { osc.stop(); } catch (e) {}
        });
        this.oscillators = [];
      }

      setMute(muted) {
        this.isMuted = muted;
        if (this.gainNode && this.ctx) {
          const t = this.ctx.currentTime;
          this.gainNode.gain.setTargetAtTime(muted ? 0 : 0.1, t, 0.1);
        }
      }
    }

    const audioEngine = new AudioSynth();

    const App = () => {
      const [prompt, setPrompt] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);
      const [isExporting, setIsExporting] = useState(false);
      const [genStatus, setGenStatus] = useState("");
      const [generatedVideo, setGeneratedVideo] = useState(null);
      const [history, setHistory] = useState([]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [currentFrameIndex, setCurrentFrameIndex] = useState(0);
      const [activeEffect, setActiveEffect] = useState("none");
      const [motionMode, setMotionMode] = useState("fast");
      const [selectedDuration, setSelectedDuration] = useState(15);
      const [selectedStyle, setSelectedStyle] = useState("Cinematic");
      const [aspectRatio, setAspectRatio] = useState("16:9");
      const [isMuted, setIsMuted] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);

      useEffect(() => {
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
        try {
          const saved = localStorage.getItem("nebula_video_history");
          if (saved) {
            const parsed = JSON.parse(saved);
            setHistory(parsed);
            if (parsed.length > 0) setGeneratedVideo(parsed[0]);
          }
        } catch (e) {
          console.error("Failed to load history from local storage", e);
        }
      }, []);

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setCurrentTime((prev) => {
              if (prev >= selectedDuration) {
                setIsPlaying(false);
                audioEngine.stop();
                return 0;
              }
              return prev + 0.05;
            });
          }, 50);
        }
        return () => clearInterval(interval);
      }, [isPlaying, selectedDuration]);

      useEffect(() => {
        if (!generatedVideo || !generatedVideo.frames || generatedVideo.frames.length === 0) return;
        const timePerFrame = selectedDuration / generatedVideo.frames.length;
        const index = Math.floor(currentTime / timePerFrame);
        setCurrentFrameIndex(Math.min(index, generatedVideo.frames.length - 1));
      }, [currentTime, selectedDuration, generatedVideo]);

      useEffect(() => {
        if (isPlaying && generatedVideo) {
          audioEngine.playAtmosphere(generatedVideo.effect);
        } else {
          audioEngine.stop();
        }
      }, [isPlaying, generatedVideo]);

      useEffect(() => {
        audioEngine.setMute(isMuted);
      }, [isMuted]);

      const togglePlay = async () => {
        if (!isPlaying) {
          await audioEngine.resume();
          if (currentTime >= selectedDuration) setCurrentTime(0);
        }
        setIsPlaying(!isPlaying);
      };

      const handleDownloadFullVideo = async () => {
        if (!generatedVideo || !generatedVideo.frames || isExporting) return;
        setIsExporting(true);

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const isWide = aspectRatio === "16:9";
        canvas.width = isWide ? 1024 : 576;
        canvas.height = isWide ? 576 : 1024;

        const loadedImages = await Promise.all(
          generatedVideo.frames.map((src) => {
            return new Promise((res) => {
              const img = new Image();
              img.crossOrigin = "anonymous";
              img.onload = () => res(img);
              img.onerror = () => res(img);
              img.src = src;
            });
          })
        );

        const canvasStream = canvas.captureStream(30);
        audioEngine.init();
        audioEngine.playAtmosphere(generatedVideo.effect);

        const combinedStream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...audioEngine.streamDestination.stream.getAudioTracks(),
        ]);

        let recorder;
        try {
          recorder = new MediaRecorder(combinedStream, { mimeType: "video/webm; codecs=vp9" });
        } catch (e) {
          recorder = new MediaRecorder(combinedStream);
        }

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          audioEngine.stop();
          const blob = new Blob(chunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "nebula_" + generatedVideo.id + ".webm";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setIsExporting(false);
        };

        recorder.start();

        const duration = generatedVideo.duration || 8;
        const totalFrames = loadedImages.length;
        const startTime = performance.now();

        const renderLoop = (now) => {
          const elapsed = (now - startTime) / 1000;
          if (elapsed >= duration) {
            recorder.stop();
            return;
          }

          const timePerFrame = duration / totalFrames;
          const frameIdx = Math.min(Math.floor(elapsed / timePerFrame), totalFrames - 1);
          const img = loadedImages[frameIdx];
          const frameProgress = (elapsed % timePerFrame) / timePerFrame;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          if (generatedVideo.mode === "fast") {
            const scale = 1 + frameProgress * 0.15;
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(scale, scale);
            ctx.drawImage(img, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
          } else {
            const shift = frameProgress * -20;
            ctx.drawImage(img, shift, 0, canvas.width + 20, canvas.height);
          }
          ctx.restore();

          requestAnimationFrame(renderLoop);
        };

        requestAnimationFrame(renderLoop);
      };

      const handleGenerate = async () => {
        if (!prompt.trim()) return;
        setIsGenerating(true);
        setGeneratedVideo(null);
        setCurrentTime(0);
        setIsPlaying(false);
        audioEngine.stop();

        const lower = prompt.toLowerCase();
        let effect = "none";
        if (lower.includes("rain")) effect = "rain";

        const baseStyle = selectedStyle === "Cinematic" ? "cinematic film still, 8k, detailed, photorealistic" :
                          selectedStyle === "Anime" ? "anime style, studio ghibli, vibrant" :
                          selectedStyle === "3D" ? "3d render, unreal engine 5, octane render" : "raw photograph, realistic";

        const width = aspectRatio === "16:9" ? 1024 : 576;
        const height = aspectRatio === "16:9" ? 576 : 1024;
        const baseSeed = Math.floor(Math.random() * 100000);

        const shots = [
          "establishing wide shot",
          "action angle shot",
          "detailed close-up view",
          "dramatic wide perspective"
        ];

        const loadedFrames = [];

        for (let i = 0; i < shots.length; i++) {
          setGenStatus("Rendering Frame " + (i + 1) + " of 4...");
          const shotPrompt = encodeURIComponent(baseStyle + ", " + shots[i] + ", " + prompt);
          const url = "https://image.pollinations.ai/prompt/" + shotPrompt + "?model=flux&width=" + width + "&height=" + height + "&seed=" + (baseSeed + i * 23) + "&nologo=true";

          try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("Fetch failed");
            const blob = await res.blob();
            const base64Data = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onloadend = () => resolve(reader.result);
              reader.readAsDataURL(blob);
            });
            loadedFrames.push(base64Data);
          } catch (err) {
            loadedFrames.push(loadedFrames[0] || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800");
          }
        }

        const newVideo = {
          id: Date.now(),
          prompt: prompt,
          frames: loadedFrames,
          thumbnail: loadedFrames[0],
          effect: effect,
          mode: motionMode,
          style: selectedStyle,
          duration: selectedDuration
        };

        setGeneratedVideo(newVideo);
        setActiveEffect(effect);
        setHistory((prev) => {
          const updated = [newVideo, ...prev.slice(0, 9)];
          try {
            localStorage.setItem("nebula_video_history", JSON.stringify(updated));
          } catch (e) {
            console.warn("Storage quota hit, trimming storage", e);
          }
          return updated;
        });

        setIsGenerating(false);

        if (document.hidden && "Notification" in window && Notification.permission === "granted") {
          new Notification("Nebula AI", {
            body: "Your video sequence has finished rendering!",
            icon: loadedFrames[0]
          });
        }
      };

      const getTransform = () => {
        const totalFrames = (generatedVideo && generatedVideo.frames) ? generatedVideo.frames.length : 1;
        const timePerFrame = selectedDuration / totalFrames;
        const frameProgress = (currentTime % timePerFrame) / timePerFrame;
        if (motionMode === "fast") {
          return "scale(" + (1 + frameProgress * 0.15) + ")";
        }
        return "scale(1.1) translateX(" + (frameProgress * -2) + "%)";
      };

      const formatTime = (time) => {
        const s = Math.floor(time);
        return "00:" + (s < 10 ? "0" : "") + s;
      };

      const timelineWidth = Math.min(100, Math.max(0, (currentTime / selectedDuration) * 100)) + "%";

      return (
        <div className="h-screen w-full bg-slate-950 text-slate-100 flex flex-col md:flex-row overflow-hidden">
          {/* Sidebar */}
          <div className={isSidebarOpen ? "fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 flex flex-col translate-x-0 transition-transform" : "fixed inset-y-0 left-0 z-50 w-72 bg-slate-900 border-r border-slate-800 flex flex-col -translate-x-full md:relative md:translate-x-0 transition-transform"}>
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <NebulaIcon className="w-8 h-8"/>
                <span className="font-bold text-lg tracking-tight">Nebula <span className="text-purple-400 text-xs">SEQ</span></span>
              </div>
              <button onClick={() => setIsSidebarOpen(false)} className="md:hidden text-slate-400 text-xs">✕ Close</button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Local Library</h3>
                <span className="text-[10px] text-slate-500">Auto-saved</span>
              </div>
              {history.length === 0 ? (
                <div className="text-center py-12 text-slate-600 text-xs">No videos in storage</div>
              ) : (
                history.map((video) => (
                  <div
                    key={video.id}
                    onClick={() => {
                      setGeneratedVideo(video);
                      setActiveEffect(video.effect);
                      setMotionMode(video.mode);
                      setSelectedDuration(video.duration);
                      setSelectedStyle(video.style);
                      setIsPlaying(false);
                      setCurrentTime(0);
                      setIsSidebarOpen(false);
                      audioEngine.stop();
                    }}
                    className="p-2 bg-slate-950 border border-slate-800 rounded-lg cursor-pointer hover:border-slate-700 flex gap-2 items-center"
                  >
                    <img src={video.thumbnail} className="w-12 h-12 object-cover rounded" />
                    <p className="text-xs text-slate-300 truncate flex-1">{video.prompt}</p>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Main Area */}
          <div className="flex-1 flex flex-col h-full min-w-0 bg-slate-950/50">
            <div className="md:hidden p-4 flex justify-between items-center bg-slate-900 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <NebulaIcon className="w-6 h-6"/>
                <span className="font-bold text-sm">Nebula Video</span>
              </div>
              <button onClick={() => setIsSidebarOpen(true)} className="text-xs text-slate-400">☰ Menu</button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center">
              <div className="w-full max-w-4xl aspect-video bg-black rounded-2xl border border-slate-800 shadow-2xl relative overflow-hidden flex items-center justify-center">
                {!generatedVideo && !isGenerating && (
                  <div className="text-center space-y-3">
                    <NebulaIcon className="w-16 h-16 mx-auto opacity-80"/>
                    <h2 className="text-xl font-bold text-white">Nebula Sequence Engine</h2>
                    <p className="text-xs text-slate-400">Generates 4 animated keyframes and auto-saves locally</p>
                  </div>
                )}

                {isGenerating && (
                  <div className="text-center space-y-3">
                    <div className="w-9 h-9 border-2 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p className="text-xs text-slate-200 font-semibold">{genStatus}</p>
                    <p className="text-[11px] text-slate-500">You can leave this tab — we'll notify you when ready!</p>
                  </div>
                )}

                {generatedVideo && !isGenerating && (
                  <div className="w-full h-full relative group">
                    <div className="absolute inset-0 w-full h-full">
                      {generatedVideo.frames.map((frame, index) => (
                        <div key={index} className={index === currentFrameIndex ? "absolute inset-0 w-full h-full opacity-100 z-10" : "absolute inset-0 w-full h-full opacity-0 z-0"}>
                          <img src={frame} className="w-full h-full object-cover" style={{ transform: getTransform(), transformOrigin: "center" }} />
                        </div>
                      ))}
                    </div>

                    {!isPlaying && (
                      <div className="absolute inset-0 bg-black/50 flex items-center justify-center cursor-pointer z-20" onClick={togglePlay}>
                        <div className="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center text-white text-xl">▶</div>
                      </div>
                    )}

                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent z-30 opacity-0 group-hover:opacity-100 transition-opacity">
                      <div className="h-1 bg-white/30 rounded cursor-pointer mb-3 relative" onClick={(e) => {
                        const rect = e.currentTarget.getBoundingClientRect();
                        const p = (e.clientX - rect.left) / rect.width;
                        setCurrentTime(p * selectedDuration);
                      }}>
                        <div className="h-full bg-purple-500 rounded" style={{ width: timelineWidth }}></div>
                      </div>
                      <div className="flex items-center justify-between text-xs">
                        <div className="flex items-center gap-3">
                          <button onClick={togglePlay} className="text-white hover:text-purple-400 font-bold">{isPlaying ? "Pause" : "Play"}</button>
                          <span className="font-mono text-slate-400">{formatTime(currentTime)} / {formatTime(selectedDuration)}</span>
                          <button onClick={() => setIsMuted(!isMuted)} className="text-slate-400 hover:text-white">{isMuted ? "Unmute" : "Mute"}</button>
                          <button onClick={handleDownloadFullVideo} disabled={isExporting} className="bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white px-2.5 py-1 rounded font-semibold transition-colors">
                            {isExporting ? "Exporting Video..." : "Download Full Video"}
                          </button>
                        </div>
                        <span className="text-[10px] bg-slate-800 px-2 py-0.5 rounded border border-slate-700">{generatedVideo.style}</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Creation Bar */}
            <div className="p-4 bg-slate-900 border-t border-slate-800">
              <div className="max-w-4xl mx-auto flex flex-col gap-3">
                <div className="flex gap-2">
                  <textarea
                    value={prompt}
                    onChange={(e) => setPrompt(e.target.value)}
                    placeholder="Describe your scene..."
                    className="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 resize-none h-14 outline-none focus:border-purple-500"
                  />
                  <button
                    onClick={handleGenerate}
                    disabled={isGenerating || !prompt}
                    className="px-6 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white rounded-xl text-xs font-bold transition-colors"
                  >
                    {isGenerating ? "Rendering..." : "Generate"}
                  </button>
                </div>

                <div className="flex flex-wrap gap-4 items-center justify-between text-xs">
                  <div className="flex items-center gap-3">
                    <span className="text-slate-500 font-bold uppercase text-[10px]">Style</span>
                    <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                      {["Cinematic", "Anime", "Realistic", "3D"].map(s => (
                        <button key={s} onClick={() => setSelectedStyle(s)} className={"px-2 py-0.5 rounded text-[10px] " + (selectedStyle === s ? "bg-slate-800 text-white" : "text-slate-500")}>{s}</button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <span className="text-slate-500 font-bold uppercase text-[10px]">Length</span>
                    <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                      {[8, 15, 20].map(d => (
                        <button key={d} onClick={() => setSelectedDuration(d)} className={"px-2 py-0.5 rounded text-[10px] " + (selectedDuration === d ? "bg-slate-800 text-white" : "text-slate-500")}>{d}s</button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button onClick={() => setMotionMode(motionMode === "fast" ? "cinematic" : "fast")} className={"px-3 py-1 rounded border text-[10px] " + (motionMode === "fast" ? "bg-red-900/30 border-red-500 text-red-400" : "border-slate-800 text-slate-500")}>Turbo Mode</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
